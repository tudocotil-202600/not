<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - SilverNews</title>
    <link rel="icon" type="image/png" href="imagens/icone.png">

    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #333333;
            background: linear-gradient(135deg, #e0f7fa 0%, #9fe3e3 100%);
            margin: 0;
            padding: 20px;
        }

        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #dcdcdc;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            
            animation: fadeIn 0.8s ease-in-out;
        }

        .header-div {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 5px solid #690ee6;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        h1 {
            color: #690ee6;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
            margin: 0 0 10px 0;
        }

        
        .info-grid {
            display: flex; 
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .info-card {
            flex: 1; 
            min-width: 250px;
            background-color: #fdfdfd;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px); 
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.12);
        }

        
        .form-card {
            background-color: #fdfdfd;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .form-group-row {
            display: flex; 
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
            flex: 1;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a5568;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            background-color: #ffffff;
            
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #690ee6;
            box-shadow: 0 0 0 3px rgba(105, 14, 230, 0.2);
        }

        .btn-submit {
            background-color: #690ee6;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #4b09ab;
            transform: scale(1.01);
        }

        
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: #003366;
            text-decoration: underline;
        }

        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            
            .info-grid {
                flex-direction: column;
            }

            .form-group-row {
                flex-direction: column;
                gap: 0;
            }
        }
        input[type="submit"] {
  background: linear-gradient(to bottom, #7c3fee, #a81bd6); 
  color: #fff;                    
  border: 1px solid #7c3fee;       
  padding: 10px 20px;              
  font-size: 16px;                 
  font-weight: bold;              
  border-radius: 4px;              
  cursor: pointer;                 
  transition: 0.3s;                
}

        input[type="submit"]:hover {
  background: linear-gradient(to bottom, #8d57f2, #cc58f3); 
  border-color: #9b6bf4;
}
    </style>
</head>
<body>

    <div class="container">

        
        <div class="header-div">
            <h1>📩 Entre em Contacto</h1>
            <p>Tem alguma história inspiradora para partilhar ou alguma dúvida? Fale connosco!</p>
        </div>

        
        <div class="info-grid">
            <div class="info-card">
                <h3>📍 Localização</h3>
                <p>Av. das Boas Notícias, 777<br>São Paulo - SP, Brasil</p>
            </div>
            <div class="info-card">
                <h3>📞 Atendimento</h3>
                <p><b>E-mail:</b> contacto@silvernews.com<br><b>Telefone:</b> (11) 99999-8888</p>
            </div>
        </div>

        
        <div class="form-card">
            <h2>Envie uma Mensagem</h2>

            <form action="#" method="POST">
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o seu nome" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="assunto">Assunto:</label>
                        <select id="assunto" name="assunto">
                            <option value="sugestao">Sugestão de Notícia</option>
                            <option value="duvida">Dúvida</option>
                            <option value="parceria">Parceria / Publicidade</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui a sua mensagem..." required></textarea>
                </div>

                 <input type="submit" name="enviar ">
            </form>
        </div>

        <br>
        <a href="index.html" class="nav-link">← Voltar para a Página Principal</a>

    </div>

</body>
</html>
